<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neurocom</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 128 128%27%3E%3Crect width=%27128%27 height=%27128%27 rx=%2728%27 fill=%27%230b1220%27/%3E%3Cpath d=%27M38 92V36L90 92V36%27 fill=%27none%27 stroke=%27%2322d3ee%27 stroke-width=%279%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#080d17; --surface:#0f1626; --raised:#16203a; --line:#24304d; --text:#e8eef5; --muted:#92a0b1; --faint:#5d6b7c;
    --accent:#22d3ee; --accent-bg:rgba(34,211,238,.13); --accent2:#6366f1; --on-accent:#04222b;
    --ok:#3fb950; --ok-bg:rgba(63,185,80,.14); --warn:#e3b341; --warn-bg:rgba(227,179,65,.14); --bad:#f85149; --bad-bg:rgba(248,81,73,.14);
    --radius:12px; color-scheme:dark;
  }
  :root[data-theme="light"] {
    --bg:#f3f5f8; --surface:#ffffff; --raised:#f0f3f7; --line:#dbe2ea; --text:#14202c; --muted:#556575; --faint:#8a97a6;
    --accent:#0e7490; --accent-bg:rgba(14,116,144,.10); --accent2:#4f46e5; --on-accent:#ffffff; --ok:#1a7f37; --ok-bg:rgba(26,127,55,.10); --warn:#8a6100; --warn-bg:rgba(154,103,0,.12); --bad:#c62828; --bad-bg:rgba(198,40,40,.09);
    color-scheme:light;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  h1,h2,h3,p { margin:0; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .num { font-variant-numeric:tabular-nums; }

  /* header */
  header { position:sticky; top:0; z-index:10; background:var(--surface); border-bottom:1px solid var(--line); }
  .bar { max-width:1180px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .brand { display:inline-flex; align-items:center; gap:10px; font-weight:700; }
  .brand svg { width:30px; height:30px; flex:none; filter:drop-shadow(0 0 8px rgba(34,211,238,.35)); }
  .brand .word { letter-spacing:.2em; font-size:15px; }
  .brand .motto { font-weight:400; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); opacity:.9; display:block; line-height:1.1; margin-top:2px; }
  .brand .lock { display:flex; flex-direction:column; }
  header::after { content:""; display:block; height:2px; background:linear-gradient(90deg,var(--accent),var(--accent2),transparent 70%); }
  .foot { max-width:1180px; margin:0 auto; padding:0 16px 36px; color:var(--faint); font-size:12.5px; text-align:center; }
  .foot a { color:var(--muted); }
  @media (max-width:640px){ .brand .motto{display:none;} }
  .status { display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--bad); flex:none; }
  .dot.on { background:var(--ok); }
  .vpwrap { flex:1; min-width:200px; max-width:460px; }
  .vptext { font-size:13px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; }
  .vptext b { color:var(--text); font-weight:600; }
  .track { height:8px; border-radius:99px; background:var(--raised); overflow:hidden; margin-top:4px; }
  .track > i { display:block; height:100%; background:var(--accent); border-radius:99px; min-width:2px; transition:width .4s; }
  .actions { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .btn { border:1px solid var(--line); background:var(--raised); padding:6px 14px; border-radius:9px; font-size:14px; }
  .btn:hover { border-color:var(--accent); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
  .btn.stop { background:var(--bad-bg); border-color:var(--bad); color:var(--bad); font-weight:600; }
  .btn.small { padding:3px 10px; font-size:13px; }
  .btn:focus-visible, .tab:focus-visible, .seg button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  nav { max-width:1180px; margin:0 auto; padding:0 12px; display:flex; gap:2px; overflow-x:auto; }
  .tab { background:none; border:0; border-bottom:2px solid transparent; padding:10px 14px; color:var(--muted); white-space:nowrap; font-size:14.5px; }
  .tab:hover { color:var(--text); }
  .tab[aria-selected="true"] { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
  .badge { display:inline-block; min-width:18px; padding:0 6px; margin-left:6px; border-radius:99px; background:var(--warn); color:#111; font-size:12px; font-weight:700; text-align:center; }

  main { max-width:1180px; margin:0 auto; padding:18px 16px 60px; }
  .stack { display:grid; gap:16px; }
  .cols { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; min-width:0; }
  .card > h2 { font-size:13px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:10px; }
  .card > h2 small { text-transform:none; letter-spacing:0; font-weight:400; color:var(--faint); margin-left:6px; }
  .sub { color:var(--muted); font-size:13.5px; }

  /* hero */
  .hero { border-left:4px solid var(--ok); }
  .hero.warn { border-left-color:var(--warn); } .hero.bad { border-left-color:var(--bad); }
  .hero h1 { font-size:21px; line-height:1.3; margin-bottom:8px; }
  .hero ul { margin:0; padding-left:18px; color:var(--muted); }
  .hero li { margin:3px 0; }
  .attn { display:grid; gap:8px; }
  .attn .item { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:9px; background:var(--raised); }
  .attn .item.warn { background:var(--warn-bg); } .attn .item.bad { background:var(--bad-bg); }
  .attn .ico { flex:none; font-weight:700; }
  .bars { display:flex; align-items:flex-end; gap:3px; height:84px; }
  .bars .b { flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:1px; height:100%; min-width:0; }
  .bars .b i { display:block; border-radius:2px 2px 0 0; min-height:0; }
  .bars .act { background:var(--accent); opacity:.85; } .bars .gain { background:var(--ok, #22c55e); } .bars .loss { background:var(--bad, #ef4444); }
  .bars-axis { display:flex; justify-content:space-between; font-size:11.5px; color:var(--faint); margin-top:4px; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-bottom:8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; max-height:132px; overflow:auto; padding:2px; }
  .chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:13px; cursor:pointer; }
  .chip input { margin:0; }
  .kpis { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; }
  .kpi .l { font-size:12.5px; color:var(--muted); }
  .kpi .v { font-size:26px; font-weight:650; line-height:1.2; }
  .kpi .d { font-size:12.5px; color:var(--muted); }
  .up { color:var(--ok); } .down { color:var(--bad); }
  .chart .plot { position:relative; touch-action:pan-y; cursor:crosshair; }
  .chart svg { width:100%; height:96px; display:block; }
  .chart .xh { position:absolute; top:0; bottom:0; width:1px; background:var(--muted); opacity:.7; display:none; pointer-events:none; }
  .chart .dotm { position:absolute; width:11px; height:11px; border-radius:50%; border:2px solid var(--surface); transform:translate(-50%,-50%); display:none; pointer-events:none; }
  .chart .tip { position:absolute; top:2px; z-index:6; min-width:168px; background:var(--raised); border:1px solid var(--line); border-radius:9px; padding:8px 11px; font-size:13px; box-shadow:0 8px 22px rgba(0,0,0,.4); pointer-events:none; display:none; }
  .chart .tip .when { color:var(--muted); font-size:12px; margin-bottom:3px; }
  .chart .tip .big { font-size:20px; font-weight:650; line-height:1.2; }
  .chart .tip table { margin-top:6px; } .chart .tip td { padding:1px 0; border:0; font-size:13px; } .chart .tip td:last-child { text-align:right; padding-left:14px; font-variant-numeric:tabular-nums; }
  .chart .axis { display:flex; justify-content:space-between; font-size:11.5px; color:var(--faint); margin-top:3px; }
  .chart .ttl { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:4px; }
  .chart .ttl b { color:var(--text); }

  /* lists & tables */
  .list { display:grid; gap:0; }
  .list > div { padding:8px 0; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:baseline; }
  .list > div:last-child { border-bottom:0; }
  .list .t { flex:none; width:64px; color:var(--faint); font-size:12.5px; }
  .list .main { min-width:0; overflow-wrap:anywhere; }
  .list .why { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12.5px; }
  .scroll { overflow:auto; max-height:480px; }
  .empty { color:var(--faint); padding:6px 0; }
  .tag { display:inline-block; padding:1px 9px; border-radius:99px; font-size:12.5px; background:var(--raised); color:var(--muted); white-space:nowrap; }
  .tag.ok { background:var(--ok-bg); color:var(--ok); } .tag.warn { background:var(--warn-bg); color:var(--warn); }
  .tag.bad { background:var(--bad-bg); color:var(--bad); } .tag.blue { background:var(--accent-bg); color:var(--accent); }
  .meter { height:7px; border-radius:99px; background:var(--raised); overflow:hidden; min-width:70px; }
  .meter > i { display:block; height:100%; background:var(--accent); }
  .meter.bad > i { background:var(--bad); } .meter.ok > i { background:var(--ok); }
  .tiles { display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .tile { background:var(--raised); border-radius:10px; padding:10px 12px; }
  .tile .n { font-size:12.5px; color:var(--muted); display:flex; justify-content:space-between; gap:6px; }
  .tile .v { font-size:20px; font-weight:600; }
  .tile .r { font-size:12.5px; }

  /* chat */
  .thread { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .thread.wait { border-color:var(--warn); background:var(--warn-bg); }
  .thread h3 { font-size:14px; margin-bottom:6px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .bubble { max-width:86%; padding:6px 11px; border-radius:12px; margin:4px 0; background:var(--raised); font-size:14px; overflow-wrap:anywhere; }
  .bubble.me { margin-left:auto; background:var(--accent-bg); }

  /* settings */
  .presets { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  .preset { text-align:left; background:var(--raised); border:2px solid var(--line); border-radius:var(--radius); padding:12px 14px; }
  .preset:hover { border-color:var(--accent); }
  .preset[aria-pressed="true"] { border-color:var(--accent); background:var(--accent-bg); }
  .preset b { display:block; margin-bottom:3px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:10px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .what b { font-weight:600; } .row .what div { color:var(--muted); font-size:13.5px; }
  .switch { position:relative; width:44px; height:25px; flex:none; }
  .switch input { opacity:0; position:absolute; inset:0; width:100%; height:100%; margin:0; cursor:pointer; }
  .switch span { position:absolute; inset:0; background:var(--line); border-radius:99px; transition:.2s; pointer-events:none; }
  .switch span::after { content:""; position:absolute; width:19px; height:19px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + span { background:var(--ok); } .switch input:checked + span::after { transform:translateX(19px); }
  .switch input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }
  details summary { cursor:pointer; color:var(--muted); padding:6px 0; }
  .grid2 { display:grid; gap:10px 16px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); margin-top:8px; }
  label.f { display:grid; gap:3px; font-size:13px; color:var(--muted); }
  input[type=number], input[type=text], select { font:inherit; color:var(--text); background:var(--raised); border:1px solid var(--line); border-radius:8px; padding:6px 9px; width:100%; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .seg button { border:0; background:transparent; padding:6px 14px; font-size:14px; }
  .seg button[aria-pressed="true"] { background:var(--accent); color:var(--on-accent); }
  .dc-steps { margin:8px 0 0; padding-left:20px; color:var(--muted); } .dc-steps li { margin:4px 0; }
  .dc-line { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-top:10px; } .dc-line > * { flex:1 1 200px; }
  .dc-line .btn { flex:0 0 auto; }
  .dc-ok { color:var(--ok); } .dc-bad { color:var(--bad); } .dc-note { margin-top:8px; font-size:13.5px; color:var(--muted); }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:8px 16px; border-radius:99px; font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; }
  .toast.show { opacity:1; }
  .hidden { display:none !important; }
  @media (max-width:560px){ .kpi .v{font-size:22px;} .hero h1{font-size:18px;} .actions{width:100%; margin-left:0;} }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand"><svg viewBox="0 0 128 128" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><rect width="128" height="128" rx="28" fill="#0b1220"/><rect x="4" y="4" width="120" height="120" rx="24" fill="none" stroke="url(#lg)" stroke-width="3"/><path d="M38 92V36L90 92V36" fill="none" stroke="url(#lg)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><g fill="#e6faff"><circle cx="38" cy="36" r="7"/><circle cx="38" cy="92" r="7"/><circle cx="90" cy="36" r="7"/><circle cx="90" cy="92" r="7"/></g></svg><span class="lock"><span class="word">NEUROCOM</span><span class="motto">Autopilot for grand strategy</span></span></span>
    <span class="status"><span class="dot" id="dot"></span><span id="conn">connecting…</span></span>
    <select id="game" aria-label="Choose game" style="width:auto;max-width:230px"></select>
    <button class="btn small" id="addgame" title="Open another tab on the game site so you can pick another game there">+ Add game</button>
    <span class="status" id="who"></span>
    <div class="vpwrap"><div class="vptext"><span>Victory points</span><span id="vptext"></span></div><div class="track"><i id="vpbar" style="width:0%"></i></div></div>
    <div class="actions">
      <button class="btn" id="theme" title="Switch light/dark" aria-label="Switch light or dark theme">Theme</button>
      <button class="btn" id="pause"></button>
    </div>
  </div>
  <nav role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>
<footer class="foot">Neurocom · unofficial, not affiliated with the game's publisher · use at your own risk · <a href="https://github.com/BigChick1142/neurocom" target="_blank" rel="noopener">GitHub</a></footer>
<div class="toast" id="toast" role="status"></div>

<script>
const TOKEN = "__TOKEN__";
const TABS = [["home","Home"],["military","Military"],["economy","Economy"],["diplomacy","Diplomacy"],["stats","Stats"],["activity","Activity"],["settings","Settings"]];
let S = null, tab = "home", logFilter = "important", playerFilter = "", lastSettingsSig = "";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const n0 = (v) => Math.round(Number(v) || 0).toLocaleString();
const n1 = (v) => (Math.round((Number(v) || 0) * 10) / 10).toLocaleString();
const ago = (t) => { const s = Math.max(0, (Date.now() - t) / 1000); if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + "m ago"; if (s < 86400) return Math.floor(s / 3600) + "h ago"; return Math.floor(s / 86400) + "d ago"; };
const clock = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const REL = { "-2":["War","bad"], "-1":["Ceasefire","warn"], "0":["Embargo","warn"], "1":["Peace","ok"], "2":["Non-aggression","ok"], "3":["Right of way","ok"], "4":["Pact","ok"], "5":["Mutual protection","ok"], "6":["Shared intel","ok"], "7":["Army command","ok"] };
const relTag = (r) => { const x = r === null || r === undefined ? ["War (default)","bad"] : (REL[String(r)] || ["Stance " + r, ""]); return `<span class="tag ${x[1]}">${esc(x[0])}</span>`; };

let currentGame = null;
const gq = () => (currentGame ? "?game=" + encodeURIComponent(currentGame) : "");
async function post(path, body) {
  const r = await fetch(path + (path === "/api/addgame" || path.startsWith("/api/discord/") ? "" : gq()), { method: "POST", headers: { "content-type": "application/json", "x-bot-token": TOKEN }, body: JSON.stringify(body) });
  if (!r.ok) { toast("That didn't save (" + r.status + ")"); throw new Error(r.status); }
  return r.json();
}
const save = (patch, msg) => post("/api/settings", patch).then(() => toast(msg || "Saved"));
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("show"), 1800); }

/* ---------- small renderers ---------- */
let chartRange = "all", hovering = false;
const CHARTS = {};
const stamp = (t) => new Date(t).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });
const GEO = { w: 300, h: 86, pad: 6 };
function histRows() {
  const h = S.history || [];
  if (chartRange === "all") return h;
  const cut = Date.now() - (chartRange === "6h" ? 6 : 24) * 3600e3;
  return h.filter((p) => p.t >= cut);
}
function spark(points, color) {
  if (!points || points.length < 2) return { html: `<div class="empty">Collecting data…</div>`, lo: 0, hi: 1 };
  const { w, h, pad } = GEO;
  const lo = Math.min(...points), hi = Math.max(...points), span = hi - lo || 1;
  const xy = points.map((v, i) => [pad + (i / (points.length - 1)) * (w - 2 * pad), h - pad - ((v - lo) / span) * (h - 2 * pad)]);
  const line = xy.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return { lo, hi, html: `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img"><path d="${line} L${xy[xy.length-1][0]} ${h} L${xy[0][0]} ${h}Z" fill="${color}" opacity=".13"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>` };
}
function trendCard(title, key, color, fmt) {
  const rows = histRows().filter((p) => typeof p[key] === "number");
  const pts = rows.map((r) => r[key]);
  const first = pts[0], last = pts[pts.length - 1];
  const d = pts.length > 1 ? last - first : 0;
  const sp = spark(pts, color);
  CHARTS[key] = { rows, key, fmt, color, title, lo: sp.lo, hi: sp.hi };
  const overlay = pts.length > 1 ? `<div class="xh"></div><div class="dotm" style="background:${color}"></div><div class="tip"></div>` : "";
  const axis = rows.length > 1 ? `<div class="axis"><span>${stamp(rows[0].t)}</span><span>${stamp(rows[rows.length - 1].t)}</span></div>` : "";
  return `<div class="card chart"><div class="ttl"><span>${title}</span><b class="num">${fmt(last ?? 0)} <span class="${d >= 0 ? "up" : "down"}">${d >= 0 ? "+" : ""}${fmt(d)}</span></b></div><div class="plot" data-chart="${key}">${sp.html}${overlay}</div>${axis}</div>`;
}
/* hover: a crosshair follows the pointer on all three charts (same moment); the hovered chart shows the full details for that moment */
function hoverAt(plot, clientX) {
  const c = CHARTS[plot.dataset.chart]; if (!c || c.rows.length < 2) return;
  const rect = plot.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
  const { w, pad } = GEO;
  const i = Math.min(c.rows.length - 1, Math.max(0, Math.round(((frac * w - pad) / (w - 2 * pad)) * (c.rows.length - 1))));
  document.querySelectorAll(".plot").forEach((pl) => {
    const cc = CHARTS[pl.dataset.chart]; if (!cc || cc.rows.length <= i) return;
    const x = (pad + (i / (cc.rows.length - 1)) * (w - 2 * pad)) / w * 100;
    const v = cc.rows[i][cc.key], span = cc.hi - cc.lo || 1;
    const y = (GEO.h - pad - ((v - cc.lo) / span) * (GEO.h - 2 * pad)) / GEO.h * 100;
    const xh = pl.querySelector(".xh"), dot = pl.querySelector(".dotm"), tip = pl.querySelector(".tip");
    if (!xh) return;
    xh.style.display = "block"; xh.style.left = x + "%";
    dot.style.display = "block"; dot.style.left = x + "%"; dot.style.top = y + "%";
    if (pl === plot) {
      const r = cc.rows[i], prev = i > 0 ? cc.rows[i - 1][cc.key] : v, start = cc.rows[0][cc.key];
      const sg = (n) => (n >= 0 ? "+" : "") + cc.fmt(n);
      tip.innerHTML = `<div class="when">${stamp(r.t)}${r.day ? " · game day " + r.day : ""}</div><div class="big">${cc.fmt(v)}</div><div class="sub">${sg(v - prev)} vs previous reading · ${sg(v - start)} since the start of this view</div><table><tr><td>Victory points</td><td>${n0(r.vp)}</td></tr><tr><td>Provinces</td><td>${n0(r.provinces)}</td></tr><tr><td>Units</td><td>${n0(r.units)}</td></tr><tr><td>Money</td><td>${n0(r.money)}</td></tr></table>`;
      tip.style.display = "block";
      if (x > 55) { tip.style.left = "auto"; tip.style.right = (100 - x + 3) + "%"; } else { tip.style.right = "auto"; tip.style.left = (x + 3) + "%"; }
    } else tip.style.display = "none";
  });
}
function endHover() {
  hovering = false;
  document.querySelectorAll(".plot .xh, .plot .dotm, .plot .tip").forEach((el) => { el.style.display = "none"; });
  if (S) render(); // pick up anything that arrived while hovering
}
document.addEventListener("pointermove", (e) => {
  const plot = e.target.closest && e.target.closest(".plot");
  if (!plot) { if (hovering) endHover(); return; }
  hovering = true; hoverAt(plot, e.clientX);
});
document.addEventListener("pointerleave", () => { if (hovering) endHover(); }, true);
function table(head, rows, empty) {
  if (!rows.length) return `<div class="empty">${esc(empty || "Nothing to show yet.")}</div>`;
  return `<div class="scroll"><table><thead><tr>${head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

  const weakAll = S.intel.weakest.filter((w) => w.weakness > 0.5);
  const weak = [...S.intel.neighbours.filter((w) => w.weakness > 0), ...weakAll.filter((w) => !w.neighbour)].slice(0, 9).map((w) => [esc(w.nation), w.human ? "Player" : "AI", w.neighbour ? `<span class="tag ok">Can attack by land</span>` : `<span class="tag">Not reachable by land</span>`, `<span class="num">${w.weakness}</span>`, esc(w.why.slice(0, 2).join(" · "))]);

  const tiles = order.filter((k) => s.resources[k]).map((k) => {

    return `<div class="tile"><div class="n"><span>${esc(r.name)}</span>${needed.has(r.name) ? `<span class="tag warn">needed</span>` : low ? `<span class="tag warn">low</span>` : ""}</div><div class="v num">${n0(r.amount)}</div><div class="r ${r.perHour >= 0 ? "up" : "down"} num">${r.perHour >= 0 ? "+" : ""}${n0(r.perHour)} per hour</div></div>`;

async function dcCall(path, body) {

    return await r.json();

}
async function dcLoad() {

}
function dcRender() {

      <div class="row" style="border:0;gap:8px;justify-content:flex-start;flex-wrap:wrap"><button class="btn small" data-dc="test">Send a test message</button><button class="btn small" data-dc="change">Change settings</button><button class="btn small" data-dc="disconnect">Disconnect</button><button class="btn small" data-dc="forget">Disconnect and forget my token</button></div>
      <p class="dc-note">Slash commands in your server: /status /report /pause /resume /reply /games. Your token is kept in the .env file on this PC only.</p>` + msg;

      <li>Open the <a href="https://discord.com/developers/applications" target="_blank" rel="noopener">Discord Developer Portal</a> and click <b>New Application</b>. Name it, for example, Neurocom.</li>
      <li>Open the <b>Bot</b> tab on the left and click <b>Reset Token</b>. Copy the token it shows once.</li>
      <li>Paste it below and press <b>Check token</b>. Neurocom finds the rest by itself.</li></ol>

    } else {

        <label class="f">Where alerts go<select data-dc-sel="channel"><option value="">My direct messages (no channel)</option>${(DC.channels || []).map((c) => `<option value="${esc(c.id)}" ${c.id === DC.channelId ? "selected" : ""}>#${esc(c.name)}</option>`).join("")}</select></label></div>`;

async function dcAction(what) {
  DC.err = ""; DC.msg = "";
  if (what === "check") {
    DC.busy = true; dcRender();
    const r = await dcCall("/api/discord/detect", { token: DC.token });
    DC.busy = false;
    if (!r.ok) { DC.err = r.error || "That did not work."; DC.info = null; dcRender(); return; }
    DC.info = r;
    DC.guildId = (r.guilds && r.guilds[0] && (r.guilds.find((g) => g.id === DC.guildId) || r.guilds[0]).id) || "";
    DC.ownerId = DC.ownerId || (r.owner ? r.owner.id : "");
    DC.channels = null; DC.channelId = "";
    dcRender();
    if (DC.guildId) await dcChannels();
    return;
  }
  if (what === "save") {
    DC.busy = true; dcRender();
    const r = await dcCall("/api/discord/save", { token: DC.token, guildId: DC.guildId, channelId: DC.channelId, ownerId: DC.ownerId });
    DC.busy = false;
    if (!r.ok) { DC.err = r.error || "Could not save."; dcRender(); return; }
    DC.editing = false; DC.token = ""; DC.info = null;
    DC.status = { ...(r.status || {}), saved: r.saved };
    DC.msg = "Saved. Neurocom is connecting: a message should arrive in a few seconds.";
    dcRender();
    setTimeout(dcLoad, 4000); // give it a moment to log in, then refresh the status
    return;
  }
  if (what === "test") { const r = await dcCall("/api/discord/test", {}); DC.msg = r.ok ? "Test message sent. Check Discord." : "Not connected."; dcRender(); return; }
  if (what === "change") { DC.editing = true; dcRender(); return; }
  if (what === "disconnect" || what === "forget") {
    if (what === "forget" && !confirm("Disconnect Discord and delete the saved token from this computer?")) return;
    const r = await dcCall("/api/discord/disconnect", { forget: what === "forget" });
    DC.status = { ...(r.status || {}), saved: r.saved }; DC.msg = what === "forget" ? "Disconnected and the token was removed." : "Disconnected. Your settings are kept."; DC.editing = false;
    dcRender();
  }
}
async function dcChannels() {
  if (!DC.guildId) return;
  const r = await dcCall("/api/discord/channels", { token: DC.token, guildId: DC.guildId });
  DC.channels = r.ok ? r.channels : [];
  // Never guess a random channel: keep the saved one, else one that is clearly meant for this, else direct messages.
  if (!DC.channelId) {
    const savedId = DC.status && DC.status.saved ? DC.status.saved.channelId : "";
    const pick = DC.channels.find((c) => c.id === savedId) || DC.channels.find((c) => /neurocom|alert/i.test(c.name));
    DC.channelId = pick ? pick.id : "";

  dcRender();
}

/* ---------- Campaign card (Settings) ---------- */
let CAMP = null, campGame = null;
function campDraft() {
  const c = S.settings.campaign || { first: "", peaceWith: [], then: [], cities: true };
  const sig = currentGame + JSON.stringify(c);
  if (!CAMP || CAMP.sig !== sig) CAMP = { sig, first: c.first || "", peace: new Set(c.peaceWith || []), then: new Set(c.then || []), cities: c.cities !== false };
  return CAMP;
}
function campPlayers(q) {
  const st = S.state; if (!st) return [];
  const me = st.me && st.me.id, border = new Set(st.frontier.map((f) => f.owner));
  const all = st.players.filter((p) => p.id !== me && p.nation && !/insurg|neutral|rebel/i.test(p.nation));
  const chosen = (p) => CAMP && (CAMP.peace.has(p.id) || CAMP.then.has(p.id));
  const pool = q ? all.filter((p) => (p.nation + " " + p.name).toLowerCase().includes(q.toLowerCase())) : all.filter((p) => border.has(p.id) || chosen(p));
  const top = q ? [] : [...all].sort((a, b) => b.vps - a.vps).slice(0, 8);
  const seen = new Set(); const out = [];
  for (const p of [...all.filter(chosen), ...pool, ...top]) if (!seen.has(p.id)) { seen.add(p.id); out.push(p); }
  return out.slice(0, 30);
}
function campChips(kind) {
  const set = kind === "peace" ? CAMP.peace : CAMP.then, q = CAMP.q || "";
  const list = campPlayers(q);
  return list.map((p) => `<label class="chip"><input type="checkbox" data-camp="${kind}" value="${p.id}" ${set.has(p.id) ? "checked" : ""}>${esc(p.nation)}${p.human ? "" : " <span class='sub'>(AI)</span>"}${p.vps ? ` <span class='sub'>${n0(p.vps)} VP</span>` : ""}</label>`).join("") || `<span class="sub">No match.</span>`;
}
function campCard() {
  const d = campDraft(), st = S.state, c = S.settings.campaign || {};
  const stage = S.campaign ? S.campaign.stage : 0, active = !!(c.first || (c.peaceWith || []).length || (c.then || []).length);
  const players = (st ? st.players : []).filter((p) => p.id !== (st.me && st.me.id)).sort((a, b) => Number(b.human) - Number(a.human) || a.nation.localeCompare(b.nation));
  const names = [...new Set((st ? st.frontier : []).map((f) => String(f.name).trim()))].sort();
  const nameOf = (id) => { const p = players.find((q) => q.id === id); return p ? p.nation : "#" + id; };
  const status = !active ? "No plan set. The bot plays on its own judgement."
    : stage === 1 ? `Step 1 of 3: taking ${esc(c.first)}.`
    : stage === 2 ? "Step 2 of 3: offering peace."
    : stage === 3 ? `Step 3 of 3: ${(c.then || []).length ? "pressing " + esc((c.then || []).map(nameOf).join(", ")) + (c.cities ? ", cities first" : "") : "plan complete"}.` : "Plan saved.";
  const chips = (kind) => `<div class="chips" id="camp-${kind}">${campChips(kind)}</div>`;
  return `<section class="card" id="camp-card"><h2>Campaign <small>an ordered plan the bot follows</small></h2>
    <p class="sub" style="margin-bottom:10px">1. Take one province. 2. Offer peace to chosen players and leave them alone. 3. Press chosen players, cities first. The bot still only attacks when its army is strong enough.</p>
    <div class="stack" style="gap:12px">
      <label class="f">1. Take this province first<input id="camp-first" list="camp-names" placeholder="e.g. a province on your border" value="${esc(d.first)}" autocomplete="off"><datalist id="camp-names">${names.map((n) => `<option value="${esc(n)}">`).join("")}</datalist></label>
      <label class="f">Find a player<input id="camp-q" placeholder="Type a nation or player name (borders and top players are listed by default)" value="${esc(d.q || "")}" autocomplete="off"></label>
      <div><div class="sub" style="margin-bottom:4px">2. Then make peace with</div>${chips("peace")}</div>
      <div><div class="sub" style="margin-bottom:4px">3. Then attack</div>${chips("then")}</div>
      <div><label class="chip" style="display:inline-flex"><input type="checkbox" id="camp-cities" ${d.cities ? "checked" : ""}>Cities first</label></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap"><button class="preset" id="camp-save" style="width:auto">Save plan</button><button class="preset" id="camp-clear" style="width:auto">Clear plan</button></div>
      <p class="sub" id="camp-status"><b>${status}</b></p></div></section>`;
}
document.addEventListener("input", (e) => {

});
function sendReply(id) {
  const box = document.querySelector(`[data-reply-box="${id}"]`); const text = (box?.value || "").trim();
  if (!text) { toast("Type a message first"); return; }
  post("/api/command", { kind: "message", args: [id, text], label: "Message sent from the dashboard" }).then(() => { box.value = ""; toast("Sent"); });
}
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.replyBox) sendReply(Number(e.target.dataset.replyBox)); });
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.sw) save({ [el.dataset.sw]: el.checked });
  else if (el.dataset.num) save({ [el.dataset.num]: el.type === "number" ? Number(el.value) : el.value });
  else if (el.dataset.nested) { const [a, b] = el.dataset.nested.split("."); save({ [a]: { [b]: Number(el.value) } }); }
});
document.addEventListener("input", (e) => { if (e.target.id === "pf") { playerFilter = e.target.value; render(); } });

const savedGame = store.get("game"); if (savedGame) currentGame = savedGame;
const savedTheme = store.get("theme"); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
const savedRange = store.get("range"); if (["6h", "24h", "all"].includes(savedRange)) chartRange = savedRange;
const savedTab = store.get("tab"); if (savedTab && VIEWS[savedTab]) tab = savedTab;
function connect() {
  const es = new EventSource("/api/events" + gq());
  connect.es = es;
  es.onmessage = (m) => {
    S = JSON.parse(m.data);
    if (S.gameId && S.gameId !== currentGame) { currentGame = S.gameId; store.set("game", currentGame); } // the saved game was closed: follow the one we were given
    render();
  };
  es.onerror = () => { $("conn").textContent = "Dashboard disconnected, retrying…"; $("dot").className = "dot"; };
}
connect();
</script>
</body>
</html>
